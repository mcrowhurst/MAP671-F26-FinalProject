<!DOCTYPE html>
<html>

<head>
  <title>Athletes In Action Campus Ministry</title>
  <!-- Change title -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css" />
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">
  <style type="text/css">
    body {
    margin: 0;
    padding: 0;
    }

    /* slippy map id */

    #map {
    width: 100%;
    height: 640px;
    /* margin: 10px auto; */
    }
    </style>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"
      integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js"></script>
    <script src="L.Control.Locate.min.js"></script>
    <script>
      $(document).ready(function () {

        // ***!***
        // Change the initial view coordinates and zoom level to match your map
        //***!***
        //var map = L.map('map').setView([37.37015718405753, -97.62451171875001], 5);
        window.map = L.map('map').setView([37.37015718405753, -97.62451171875001], 5);
        var overlayBounds = L.latLngBounds([14.355703054503032, -138.14973592149713], [55.01069357837779, -57.060063641564184]);



        //***!***
        // Change the L.tileLayer(path/to/tiles/{z}/{x}/{y}.png) property
        // Should work as is if you didn't change names or create extra folders
        //***!***
        var mytile = L.tileLayer('tiles/{z}/{x}/{y}.png', {tms: true, opacity: 1.0, attribution: "", minZoom: 5, maxZoom: 10, bounds: overlayBounds, noWrap: true}).addTo(window.map);
        //window.map.fitBounds(overlayBounds);

        // ***!*** Nothing else to change	

        // Below code block adds a geolocation tool and scale.
        // Stay tuned for Map 672 for more!
        // Use the geolocate plugin!
        var locate_options = {
          watch: true,
          enableHighAccuracy: true,
          position: 'topleft'
        };
        L.control.locate(locate_options).addTo(window.map); // add the tool to the map

        L.control.scale().addTo(window.map); // maps like this need scales, yo!

      })
    </script>
</head>

<body>
  <div id="map">

  </div>
</body>

</html>
